pid /tmp/lostfound-phase7-nginx.pid;
error_log /tmp/lostfound-phase7-nginx-error.log notice;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  access_log /tmp/lostfound-phase7-nginx-access.log;
  server {
    listen 127.0.0.1:8090;
    server_name localhost;
    root /var/www/myapi/src/frontend/dist/lost-found-web/browser;
    index index.html;
    client_max_body_size 10m;
    location /api/ { proxy_pass http://127.0.0.1:5090; proxy_http_version 1.1; proxy_set_header Host $host; }
    location /hubs/communication { proxy_pass http://127.0.0.1:5090; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
    location /uploads/ { proxy_pass http://127.0.0.1:5090; }
    location ~ ^/health(?:/|$) { proxy_pass http://127.0.0.1:5090; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
